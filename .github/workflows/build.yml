name: build-feed

on:
  schedule:
    - cron: '0 3 * * *' # daily 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node build.js
      - name: Commit if changed
        run: |
          git config user.name "Joel Stephen"
          git config user.email "joelstephen97@users.noreply.github.com"
          git add blocklist.json
          git diff --cached --quiet || git commit -m "feed: daily update"
          git push
